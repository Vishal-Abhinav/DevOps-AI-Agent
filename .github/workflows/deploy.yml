name: Python CI with Flask and Firebase Hosting

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests (if any)
      run: |
        if [ -d tests ]; then
          python -m unittest discover -s tests
        else
          echo "No tests found."
        fi

    - name: Build Flask App (sanity check)
      run: |
        python app.py &
        sleep 5
        curl -f http://localhost:5000 || (echo "App failed to start" && exit 1)
        pkill -f app.py

    - name: Install Firebase CLI
      run: |
        curl -sL https://firebase.tools | bash

    - name: Firebase Deploy
      env:
        FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      run: |
        firebase deploy --only hosting --project your-project-id --token "$FIREBASE_TOKEN"
