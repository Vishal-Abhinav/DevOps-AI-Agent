name: Python CI with Flask and Firebase Hosting

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.10

    - name: Install dependencies
      run: |
        python -m venv venv
        source venv/bin/activate
        pip install -r requirements.txt

    - name: Test the Flask app
      run: |
        source venv/bin/activate
        python -m unittest discover -s tests  # Assuming you have tests
     
    - name: Build the app
      run: |
        source venv/bin/activate
        python app.py  # Start your app to ensure everything is working

    - name: Install Firebase CLI
      run: |
        curl -sL https://firebase.tools | bash
        export PATH="$PATH:/home/runner/.firebase-tools/bin"

    - name: Authenticate Firebase
      run: |
        echo "${{ secrets.FIREBASE_TOKEN }}" | firebase login:ci --token

    - name: Firebase Deploy
      run: |
        firebase use --add  # Select the correct project
        firebase deploy --only hosting --project <your-firebase-project-id>
      
